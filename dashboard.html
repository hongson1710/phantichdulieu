<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IE313 · Dashboard hành vi khách hàng</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #0a1020; color: #f3f6fb; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 12px 24px; background: #121d31; border-bottom: 1px solid #283950; }
    .brand { font-weight: 700; letter-spacing: .02em; }
    nav { display: flex; gap: 8px; align-items: center; }
    button, a { border: 1px solid #43546e; background: #1b2b46; color: #f3f6fb; border-radius: 8px; padding: 9px 14px; font: inherit; cursor: pointer; text-decoration: none; }
    button[aria-selected="true"] { background: #52d6d0; border-color: #52d6d0; color: #0a1020; font-weight: 700; }
    button:hover, a:hover { border-color: #52d6d0; }
    main { min-height: calc(100vh - 61px); display: grid; place-items: center; padding: 16px; }
    main img { display: block; width: min(100%, calc((100vh - 100px) * 16 / 9)); max-height: calc(100vh - 100px); aspect-ratio: 16 / 9; object-fit: contain; box-shadow: 0 18px 70px #0007; }
    @media (max-width: 760px) { header { flex-direction: column; } .brand { font-size: .9rem; } nav { flex-wrap: wrap; justify-content: center; } main { min-height: auto; } main img { width: 100%; max-height: none; } }
    @media print { header { display: none; } main { padding: 0; min-height: 0; } main img { width: 100vw; max-height: 100vh; box-shadow: none; } @page { size: landscape; margin: 0; } }
  </style>
</head>
<body>
  <header>
    <div class="brand">IE313 · Dashboard hành vi khách hàng</div>
    <nav aria-label="Chọn màn hình dashboard">
      <button type="button" data-page="1" aria-selected="true">01 · Tổng quan</button>
      <button type="button" data-page="2" aria-selected="false">02 · Mối liên hệ</button>
      <a id="download" href="charts/dashboard_01_tong_quan.png" download>Tải PNG 16:9</a>
    </nav>
  </header>
  <main>
    <img id="dashboard" src="charts/dashboard_01_tong_quan.png" alt="Dashboard tổng quan hành vi khách hàng">
  </main>
  <script>
    const pages = {
      1: { src: 'charts/dashboard_01_tong_quan.png', alt: 'Dashboard tổng quan hành vi khách hàng' },
      2: { src: 'charts/dashboard_02_moi_lien_he.png', alt: 'Dashboard các mối liên hệ và so sánh nhóm' }
    };
    const image = document.querySelector('#dashboard');
    const download = document.querySelector('#download');
    for (const button of document.querySelectorAll('button[data-page]')) {
      button.addEventListener('click', () => {
        const page = pages[button.dataset.page];
        image.src = page.src;
        image.alt = page.alt;
        download.href = page.src;
        for (const item of document.querySelectorAll('button[data-page]')) {
          item.setAttribute('aria-selected', String(item === button));
        }
      });
    }
  </script>
</body>
</html>
